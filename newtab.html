<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindspace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <input type="file" id="file-import" accept=".json" style="display: none;">

    <div id="viewport">
        <canvas id="drawing-canvas"></canvas>
        <div id="world"></div>
    </div>

    <div id="property-bar" class="glass-panel hidden">
        <div id="prop-text-controls" class="prop-group" style="display:none;">
            <div class="control-item" style="position: relative;">
                <label>Font Family</label>
                <div class="input-with-action">
                    <input type="text" id="prop-font-family" placeholder="Select Font..." autocomplete="off">
                    <button id="btn-sync-fonts" class="icon-btn small" title="Sync Local Fonts">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path><polyline points="9 11 12 14 22 4"></polyline></svg>
                    </button>
                </div>
                <div id="custom-font-list" class="glass-dropdown hidden"></div>
            </div>

            <div class="divider-v"></div>
            
            <div class="control-item">
                <label>Size</label>
                <input type="number" id="prop-font-size" min="8" max="300" value="18">
            </div>
            
            <div class="divider-v"></div>
            
            <button class="icon-btn" id="prop-bold" title="Bold"><b>B</b></button>
            <button class="icon-btn" id="prop-italic" title="Italic"><i>I</i></button>
        </div>

        <div class="prop-group">
            <div class="divider-v"></div>
            <div class="control-item color-item">
                <input type="color" id="prop-color">
            </div>
            <div class="divider-v"></div>
            <button class="icon-btn danger" id="prop-delete" title="Delete Element">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
    </div>

    <div id="orb-wrapper">
        <div id="orb-main" role="button" tabindex="0" aria-label="Open Mindspace tools" aria-expanded="false">
            <img src="icons/icon-128.png" id="orb-icon" draggable="false" alt="">
            <div id="orb-fallback"><span>M</span></div>
        </div>
        
        <div id="orb-menu" class="glass-panel">
            <div class="menu-section">
                <button class="tool-btn active" id="tool-select" title="Select (V)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path></svg>
                    <span>Select</span>
                </button>
                <button class="tool-btn" id="tool-text" title="Text (T)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
                    <span>Text</span>
                </button>
                <button class="tool-btn" id="tool-draw" title="Draw (P)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
                    <span>Draw</span>
                </button>
                <button class="tool-btn" id="tool-eraser" title="Eraser (E)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21l-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="M5 11l9 9"/></svg>
                    <span>Erase</span>
                </button>
            </div>
            
            <div class="divider"></div>

            <div class="menu-section compact-actions">
                <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
                    <span>Undo</span>
                </button>
                <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
                    <span>Redo</span>
                </button>
                <button class="tool-btn" id="btn-fit" title="Fit All (0)" aria-label="Fit all content">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
                    <span>Fit</span>
                </button>
            </div>

            <div class="divider"></div>
            
            <div class="menu-section">
                <button class="tool-btn" id="tool-note" title="Add Note">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    <span>Note</span>
                </button>
            </div>
            <div class="divider"></div>

            <div class="menu-section vertical">
                <div class="control-row">
                    <label>Brush</label>
                    <input type="range" id="brush-size" min="2" max="40" value="4">
                </div>
                <div class="control-row">
                    <label>Color</label>
                    <div class="color-wrapper">
                        <input type="color" id="brush-color" value="#333333">
                    </div>
                </div>
            </div>
            
            <div class="divider"></div>
            
            <div class="menu-section">
                <button class="tool-btn" id="btn-backup" title="Download Backup">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Backup</span>
                </button>
                <button class="tool-btn" id="btn-restore" title="Load Backup">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>Load</span>
                </button>
            </div>

            <div class="divider"></div>

            <div class="menu-section">
                <button class="tool-btn" id="theme-toggle" title="Toggle Theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
                <button class="tool-btn danger" id="clear-board" title="Clear All">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="context-menu" class="glass-panel hidden"></div>
    <div id="save-indicator" class="glass-panel" role="status" aria-live="polite">Saved</div>

    <script src="script.js"></script>
</body>
</html>
